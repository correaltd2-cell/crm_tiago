<style>
/* ═══ PROMPT STAR · identidade oficial — cores sólidas, sem degradê ═══
   Paleta única do sistema. Trocar uma cor aqui troca no app inteiro. */
:root{
  /* ---- as 6 cores oficiais ---- */
  --amarelo:#F9D132;
  --lilas:#DB80FF;
  --branco:#FFFFFF;
  --verde:#C1FF72;
  --vermelho:#FF5757;
  --roxo:#290F5D;

  /* ---- variações de apoio (só claro/escuro das oficiais, sem cor nova) ---- */
  --roxo-claro:#3d1a85; --roxo-escuro:#1b0940;
  --amarelo-escuro:#c9a41c; --lilas-escuro:#a94fd0;
  --verde-escuro:#5c8f1f; --vermelho-escuro:#c92f2f;
  --roxo-tint:#efeaf8; --amarelo-tint:#fdf4d6; --lilas-tint:#f7ecff;
  --verde-tint:#f0fde0; --vermelho-tint:#ffeceC;

  /* ---- superfícies e texto ---- */
  --bg0:#f5f3fa; --bg1:#ffffff; --bg2:#efeaf8;
  --vidro:#ffffff; --vidro2:#f7f4fc;
  --borda:rgba(41,15,93,.14); --borda2:rgba(41,15,93,.24);
  --texto:#290F5D; --sub:#5b4a80; --sub2:#8b7fa8;

  /* ---- nomes antigos apontando para a paleta nova (compatibilidade) ---- */
  --navy:var(--roxo); --navy2:var(--roxo-claro); --navy3:var(--roxo-escuro);
  --az1:var(--lilas); --az2:var(--roxo); --az3:var(--roxo-escuro);
  --ouro:var(--amarelo); --ouro-claro:var(--amarelo); --ouro-escuro:var(--amarelo-escuro);
  --azul:var(--roxo); --azul2:var(--bg2); --dourado:var(--amarelo);
  --fundo:var(--bg0); --card:var(--vidro);
  --ok:var(--verde-escuro); --erro:var(--vermelho); --aviso:var(--amarelo-escuro);
  --prospec:var(--lilas); --prospec-esc:var(--lilas-escuro); --prospec-bg:var(--lilas-tint);
  --grad-azul:var(--roxo); --grad-ouro:var(--amarelo); --grad-ouro-txt:none;

  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --sombra-1:0 1px 2px rgba(41,15,93,.08),0 8px 20px -12px rgba(41,15,93,.22);
  --sombra-2:0 2px 8px rgba(41,15,93,.12),0 20px 44px -20px rgba(41,15,93,.30);
  --sombra-azul:0 8px 20px -10px rgba(41,15,93,.55);
  --sombra-ouro:0 8px 18px -10px rgba(201,164,28,.55);
  --glow-rgb:219,128,255;
  --fab1:var(--amarelo); --fab2:var(--amarelo); --fab3:var(--amarelo); --fab4:var(--amarelo-escuro);
}
/* ── cor de destaque (Mais → Aparência) — só cores da paleta oficial ── */
:root[data-tema="lilas"]{--ouro:var(--lilas);--ouro-escuro:var(--lilas-escuro);--glow-rgb:219,128,255;
  --fab1:var(--lilas);--fab2:var(--lilas);--fab3:var(--lilas);--fab4:var(--lilas-escuro)}
:root[data-tema="verde"]{--ouro:var(--verde);--ouro-escuro:var(--verde-escuro);--glow-rgb:193,255,114;
  --fab1:var(--verde);--fab2:var(--verde);--fab3:var(--verde);--fab4:var(--verde-escuro)}
:root[data-tema="vermelho"]{--ouro:var(--vermelho);--ouro-escuro:var(--vermelho-escuro);--glow-rgb:255,87,87;
  --fab1:var(--vermelho);--fab2:var(--vermelho);--fab3:var(--vermelho);--fab4:var(--vermelho-escuro)}
:root[data-tema="roxo"]{--ouro:var(--roxo);--ouro-escuro:var(--roxo-escuro);--glow-rgb:41,15,93;
  --fab1:var(--roxo);--fab2:var(--roxo);--fab3:var(--roxo);--fab4:var(--roxo-escuro)}

/* ═══ tipografia oficial: Poppins (arquivos no próprio app, funciona offline) ═══ */
@font-face{font-family:'Poppins';font-style:normal;font-weight:400;font-display:swap;
  src:url(fontes/poppins-400-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Poppins';font-style:normal;font-weight:400;font-display:swap;
  src:url(fontes/poppins-400-latin-ext.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-style:normal;font-weight:500;font-display:swap;
  src:url(fontes/poppins-500-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Poppins';font-style:normal;font-weight:500;font-display:swap;
  src:url(fontes/poppins-500-latin-ext.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-style:normal;font-weight:600;font-display:swap;
  src:url(fontes/poppins-600-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Poppins';font-style:normal;font-weight:600;font-display:swap;
  src:url(fontes/poppins-600-latin-ext.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-style:normal;font-weight:700;font-display:swap;
  src:url(fontes/poppins-700-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Poppins';font-style:normal;font-weight:700;font-display:swap;
  src:url(fontes/poppins-700-latin-ext.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-style:normal;font-weight:800;font-display:swap;
  src:url(fontes/poppins-800-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Poppins';font-style:normal;font-weight:800;font-display:swap;
  src:url(fontes/poppins-800-latin-ext.woff2) format('woff2')}
:root{--fonte:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:var(--bg0)}
body{font-family:var(--fonte);color:var(--texto);
  display:flex;flex-direction:column;overscroll-behavior:none;background:var(--bg0);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;background:
  transparent,
  transparent,
  var(--bg0)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;font-family:var(--fonte)}
input,select,textarea{font:inherit;font-family:var(--fonte)}
::selection{background:rgba(var(--glow-rgb),.35)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(148,168,220,.25);border-radius:99px}

/* ── topo: vidro com brilho de fio dourado ── */
#topbar{background:var(--roxo);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));
  display:flex;align-items:center;position:sticky;top:0;z-index:20;
  border-bottom:1px solid var(--borda);
  box-shadow:0 6px 18px -8px rgba(36,27,82,.4)}
#topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:var(--lilas-tint)}
#topbar strong{letter-spacing:.02em;font-size:1.02rem}
#topbar .sub{color:#b9c4e6}
.sel-rep{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:10px;
  padding:6px 10px;max-width:190px;box-shadow:var(--sombra-1);backdrop-filter:blur(8px)}
.sync-chip{font-size:.7rem;font-weight:600;letter-spacing:.02em;padding:5px 11px;border-radius:999px;
  background:rgba(255,255,255,.16);color:#eaf0ff;border:1px solid rgba(255,255,255,.25);white-space:nowrap;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset;transition:.3s}
.sync-chip.ok{background:rgba(46,194,126,.22);color:#b6f2d5;border-color:rgba(46,194,126,.5)}
.sync-chip.off{background:rgba(248,177,60,.22);color:#ffe0a6;border-color:rgba(248,177,60,.5)}
.sync-chip.erro{background:rgba(232,71,76,.22);color:#ffc9cb;border-color:rgba(232,71,76,.55)}

#view{flex:1;overflow-y:auto;padding:16px;padding-bottom:118px;max-width:640px;width:100%;margin:0 auto;position:relative}

/* ── dock flutuante 3D ── */
#tabs{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(94%,560px);
  display:flex;background:var(--roxo);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid var(--borda2);border-radius:24px;padding:6px 6px calc(6px + env(safe-area-inset-bottom)/2);
  z-index:20;box-shadow:0 10px 30px -10px rgba(36,27,82,.45)}
#tabs button{flex:1;min-width:0;padding:9px 1px 8px;font-size:.55rem;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;color:#98a3cc;
  display:flex;flex-direction:column;gap:5px;align-items:center;border-radius:18px;transition:.25s;position:relative}
#tabs button .ic{width:21px;height:21px;stroke-width:1.5;transition:transform .25s,stroke-width .25s}
#tabs button.ativo{color:#ffd062;background:rgba(255,255,255,.14);
  box-shadow:0 1px 0 rgba(255,255,255,.16) inset}
#tabs button.ativo .ic{stroke-width:1.9;transform:translateY(-1px)}
#tabs button:active .ic{transform:scale(.9)}

/* ── FAB: esfera dourada ── */
#fab{position:fixed;right:16px;bottom:96px;width:58px;height:58px;border-radius:50%;
  background:var(--ouro);
  color:#fff;z-index:19;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 3px rgba(255,255,255,.55) inset,0 -4px 8px rgba(8,40,90,.45) inset,
    0 14px 30px -8px rgba(var(--glow-rgb),.55),0 18px 36px -14px rgba(15,23,55,.5);
  transition:transform .2s,box-shadow .2s}
#fab:active{transform:scale(.92);box-shadow:0 2px 3px rgba(255,255,255,.4) inset,0 -2px 6px rgba(8,40,90,.45) inset,0 8px 18px -8px rgba(var(--glow-rgb),.5)}

/* ── ícones: traço fino que herda a cor do texto ── */
.ic{width:1.12em;height:1.12em;flex:0 0 auto;vertical-align:-.19em;
  fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
  overflow:visible}
.ic-lg{width:1.35em;height:1.35em;stroke-width:1.55}
.ic-sm{width:.95em;height:.95em;stroke-width:1.85}
#fab .ic{width:25px;height:25px;stroke-width:1.6}
.ic-ok{color:var(--ok)}.ic-erro{color:var(--erro)}.ic-aviso{color:var(--ouro-escuro)}

/* ── tipografia: mais ar entre as letras dos títulos, peso controlado ── */
h1{font-size:1.46rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.2rem;font-weight:800;letter-spacing:-.015em}
h3{font-size:.95rem;font-weight:800;letter-spacing:.045em;text-transform:uppercase;color:var(--navy)}
h4{font-size:.7rem;font-weight:700;color:var(--sub);letter-spacing:.09em;text-transform:uppercase}
.sub{font-size:.8rem;color:var(--sub)}
.row{display:flex;align-items:center}.col{display:flex;flex-direction:column}
.space{justify-content:space-between}.gap4{gap:4px}.gap8{gap:8px}.grow{flex:1}
.w100{width:100%}.c{text-align:center}.r{text-align:right}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb12{margin-bottom:12px}

/* ── campos ── */
.input{width:100%;padding:11px 13px;border:1px solid var(--borda);border-radius:var(--r-sm);
  background:#fff;color:var(--texto);
  box-shadow:0 1px 2px rgba(22,35,59,.05) inset;transition:.25s}
.input::placeholder{color:var(--sub)}
input[type=checkbox],input[type=radio]{accent-color:var(--az3);width:22px;height:22px;flex:0 0 auto}
.input:focus{outline:none;border-color:rgba(var(--glow-rgb),.55);
  box-shadow:0 0 0 3px rgba(var(--glow-rgb),.18)}
.input.big{padding:15px;font-size:1.05rem;border-radius:var(--r-md)}
.input.num{width:76px;text-align:center;padding:12px 4px;font-size:1.18rem;font-weight:800;
  color:var(--navy);border:1.5px solid var(--borda2);font-variant-numeric:tabular-nums}
select.input,select.input.big{appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.campo{display:flex;flex-direction:column;gap:3px}

/* ── botões 3D ── */
/* ícone + texto sempre alinhados e com respiro, sem depender de espaço em branco */
.btn,.btn-sec,.btn-mini,.btn-tam,.chip,.badge,.btn-link,.btn-icon,.btn-step{
  display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-mini,.badge,.btn-link{gap:6px}
.btn-icon{gap:0;color:var(--sub)}
.btn-icon:hover{color:var(--navy)}
.btn{background:var(--grad-azul);color:#fff;border-radius:var(--r-md);padding:13px 18px;font-weight:800;
  letter-spacing:.01em;box-shadow:var(--sombra-azul);transition:transform .15s,box-shadow .2s,filter .2s;
  text-shadow:0 1px 2px rgba(9,40,90,.35)}
.btn:active{transform:translateY(2px) scale(.985);filter:brightness(.94);
  box-shadow:0 4px 10px -6px rgba(21,96,189,.5)}
.btn:disabled{opacity:.35;filter:grayscale(.4)}
.btn.big{padding:17px;font-size:1.06rem;border-radius:16px}
.btn-sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy);
  box-shadow:var(--sombra-1);text-shadow:none;font-weight:700}
.btn-sec:active{transform:translateY(2px) scale(.985)}
.btn-link{color:var(--az3);text-decoration:underline;text-underline-offset:3px;font-size:.85rem;padding:4px}
.btn-icon{font-size:1.05rem;padding:6px;border-radius:8px;transition:.2s}
.btn-icon:active{transform:scale(.85)}
.btn-mini{background:var(--vidro2);border:1px solid var(--borda);border-radius:11px;padding:10px 13px;
  font-size:.82rem;font-weight:700;color:var(--texto);box-shadow:var(--sombra-1);transition:.2s}
.btn-mini:active{transform:translateY(1px) scale(.97)}
.btn-mini.verde{background:var(--verde);color:#fff;border-color:#1a6b2c;
  box-shadow:0 6px 14px -8px rgba(30,126,52,.7)}
.btn-mini.vermelho{background:#fdeced;color:#c62c32;border-color:rgba(232,71,76,.45)}
.btn-mini.classe-ativa{background:var(--roxo);border-color:var(--navy);color:#fff}
/* +/− do pedido: azul cheio com sinal branco — bem visível e fácil de acertar o dedo */
.btn-step{width:50px;height:50px;border-radius:13px;background:var(--grad-azul);border:none;
  font-size:1.6rem;line-height:1;font-weight:900;color:#fff;box-shadow:var(--sombra-azul);transition:.15s}
.btn-step:active{transform:scale(.92);filter:brightness(.93)}
/* linha de quantidade: rótulo à esquerda, controles à direita */
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:#fff;border:1.5px solid var(--borda2);border-radius:var(--r-md);padding:10px 12px;
  box-shadow:var(--sombra-1)}
.stepper-label{font-size:.84rem;font-weight:800;color:var(--navy);line-height:1.2;flex:1;min-width:0}
.btn-tam{flex:1;padding:13px 6px;border:1.5px solid var(--borda2);border-radius:var(--r-md);
  background:#fff;font-weight:800;font-size:.88rem;line-height:1.2;color:var(--navy);
  box-shadow:var(--sombra-1);transition:.25s}
.btn-tam:disabled{color:var(--sub2);background:var(--bg2);opacity:.6}
.btn-tam.ativo{border-color:var(--az3);color:#fff;background:var(--grad-azul);
  box-shadow:0 0 0 3px rgba(var(--glow-rgb),.2),0 8px 20px -10px rgba(var(--glow-rgb),.6)}

/* ── listas e cartões de vidro ── */
.lista{margin-top:10px;display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;padding:2px}
.item-lista{background:var(--vidro);backdrop-filter:blur(10px);border:1px solid var(--borda);
  border-radius:var(--r-md);padding:13px 15px;text-align:left;display:flex;flex-direction:column;gap:2px;width:100%;
  box-shadow:var(--sombra-1);transition:transform .18s,border-color .25s}
.item-lista:active{transform:scale(.985);border-color:rgba(var(--glow-rgb),.4)}
.item-lista.compacto{flex-direction:row;justify-content:space-between;align-items:center;padding:10px 13px}
.item-lista.desabilitado{opacity:.45}
.item-lista.st-vermelho{border-left:3px solid var(--erro)}
.item-lista.st-amarelo{border-left:3px solid var(--aviso)}
.item-lista.st-verde{border-left:3px solid var(--ok)}
.item-lista.st-cinza{border-left:3px solid rgba(133,147,171,.45)}
.chip{background:var(--roxo);color:#fff;border:1.5px solid transparent;
  border-radius:999px;padding:10px 16px;font-weight:800;font-size:.86rem;white-space:nowrap;
  box-shadow:0 4px 12px -6px rgba(36,27,82,.5);transition:.2s}
.chip.ativo{background:var(--ouro);color:#2b1c00;border-color:var(--ouro-escuro);
  box-shadow:0 6px 16px -6px rgba(201,134,26,.6)}
.chip:active{transform:scale(.96)}
/* filtro de prospecção na rota: roxo, igual ao resto da prospecção */
.chip.prospec{background:var(--lilas)}
.chip.prospec.ativo{background:var(--ouro);color:#2b1c00;border-color:var(--prospec-esc)}
.chip .ic{width:1.05em;height:1.05em;margin-right:5px;vertical-align:-2px}
/* triângulo de observação interna — bem visível, com brilho pulsante */
.alerta-obs{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
  flex:0 0 auto;margin-right:6px;vertical-align:-6px;background:#ffc61a;color:#111;
  font-weight:900;font-size:.9rem;line-height:1;padding-top:7px;
  -webkit-clip-path:polygon(50% 0,100% 100%,0 100%);clip-path:polygon(50% 0,100% 100%,0 100%);
  filter:drop-shadow(0 2px 4px rgba(214,158,0,.55));animation:pisca-obs 2.4s ease-in-out infinite}
@keyframes pisca-obs{0%,100%{filter:drop-shadow(0 2px 4px rgba(214,158,0,.55))}
  50%{filter:drop-shadow(0 2px 9px rgba(255,198,26,.95))}}
.st-tag{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0;
  flex:0 0 auto;box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 0 4px rgba(36,27,82,.07)}
.row>.st-tag,.chip>.st-tag{margin-right:0}
/* linha do menu "Mais": ícone · título/descrição · seta */
.item-menu{width:100%;display:flex;align-items:center;gap:14px;text-align:left;
  background:#fff;border:1px solid var(--borda);border-radius:var(--r-md);padding:14px 16px;
  box-shadow:var(--sombra-1);transition:transform .18s,border-color .25s}
.item-menu:active{transform:scale(.99);border-color:var(--az2)}
.item-menu>.ic:first-child{color:var(--az3)}
.item-menu>.col{flex:1;min-width:0}
.item-menu strong{font-size:.95rem;color:var(--navy)}
.item-menu>.ic:last-child{color:var(--sub2)}
.st-tag.vermelho{background:var(--erro)}.st-tag.amarelo{background:var(--aviso)}
.st-tag.verde{background:var(--ok)}.st-tag.cinza{background:#98a4b8}
/* numeração da ordem da rota (a ordem se muda pelos botões ↑ ↓) */
.ordem-num{flex:0 0 auto;min-width:22px;height:22px;padding:0 5px;border-radius:7px;
  background:var(--navy);color:#fff;font-size:.72rem;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center}
/* prospecção: roxo, para não confundir com cliente que já compra */
.card-visita.prospec{border-left:4px solid var(--prospec) !important;
  background:var(--lilas-tint)}
.badge.prospec{background:var(--prospec);color:#fff;border-color:var(--prospec-esc);
  letter-spacing:.08em;font-weight:800}
.item-lista.prospec{border-left:3px solid var(--prospec);background:var(--lilas-tint)}
.card-visita.st-vermelho{border-left:4px solid var(--erro)}
.card-visita.st-amarelo{border-left:4px solid var(--aviso)}
.card-visita.st-verde{border-left:4px solid var(--ok)}
.card-visita.st-cinza{border-left:4px solid #98a4b8}
/* assinatura em tela cheia */
.assina-full{position:fixed;inset:0;z-index:60;background:#fff;display:flex;flex-direction:column}
.assina-full .topo{padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:1px solid var(--borda)}
.assina-full .area{flex:1;margin:10px;border:2px dashed var(--borda2);border-radius:14px;background:#fdfdfb;overflow:hidden}
.assina-full canvas{display:block;width:100%;height:100%;touch-action:none}
.vazio{color:var(--sub);text-align:center;padding:30px 12px;font-weight:500;font-size:.88rem;line-height:1.6}
.badge{font-size:.68rem;font-weight:700;letter-spacing:.02em;background:var(--bg2);color:var(--navy);font-weight:800;
  border:1px solid var(--borda);border-radius:999px;padding:4px 10px;white-space:nowrap}
.badge.ok{background:#e7f6ec;color:#166b2c;border-color:rgba(30,126,52,.35)}
.badge.erro{background:#fdeced;color:#c62c32;border-color:rgba(232,71,76,.35)}
.badge.aviso{background:#fff4e0;color:#95610b;border-color:rgba(240,160,32,.45)}

.card-visita{background:var(--vidro);backdrop-filter:blur(10px);border:1px solid var(--borda);
  border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--sombra-1)}
.card-visita.feito{opacity:.62;filter:saturate(.6)}
/* cliente já atendido: cartão menor, para sobrar tela para quem ainda falta */
.card-visita.compacto{padding:9px 12px;border-radius:14px}
.card-visita.compacto strong{font-size:.88rem}
.card-visita.compacto .btn-mini{padding:7px 10px;font-size:.74rem;border-radius:9px}
.card-visita.compacto .btn-mini .ic{width:1em;height:1em}
.card-visita.compacto .atendido-linha{padding:4px 8px;font-size:.74rem}
.card-visita.compacto .cnpj-chip{padding:2px 7px;font-size:.72rem}
/* CNPJ em destaque na rota e na ficha do cliente */
.cnpj-chip{display:inline-flex;align-items:center;gap:7px;background:var(--navy);color:#fff;
  border-radius:9px;padding:4px 10px;font-weight:800;font-size:.8rem;letter-spacing:.02em;
  font-variant-numeric:tabular-nums}
.cnpj-chip .cnpj-rot{font-size:.62rem;font-weight:900;letter-spacing:.1em;opacity:.72}
.cnpj-chip.grande{font-size:.95rem;padding:7px 13px;border-radius:11px;
  box-shadow:0 8px 18px -10px rgba(36,27,82,.8)}
/* pedido faturado no New Star: bolinha laranja com a nota fiscal */
.card-pedido{position:relative}
.selo-nf{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#fff;
  background:var(--amarelo);
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 6px 14px -6px rgba(200,105,10,.85)}
.selo-nf .ic{width:17px;height:17px;stroke-width:1.9}
.card-pedido:has(.selo-nf) .grow{padding-right:42px}
.btn-mini.laranja,.btn.laranja{background:var(--amarelo);color:#fff;
  border-color:#c8690a;box-shadow:0 6px 14px -8px rgba(200,105,10,.9)}
/* cliente PRIORITÁRIO: azul, para não confundir com o roxo da prospecção */
.card-visita.prioritario{border-left:4px solid var(--az2) !important;
  background:var(--roxo-tint)}
.item-lista.prioritario{border-left:3px solid var(--az2);
  background:var(--roxo-tint)}
/* prospecção continua mandando na borda quando for os dois */
.card-visita.prospec.prioritario{border-left:4px solid var(--prospec) !important}
.badge.prioritario{background:var(--roxo);color:#fff;
  border-color:var(--az3);letter-spacing:.06em;font-weight:800}
.badge.prioritario .ic{width:1em;height:1em}
.btn-mini.prioritario{background:var(--roxo);color:#fff;
  border-color:var(--az3);box-shadow:0 6px 14px -8px rgba(17,80,168,.8)}
.chip.prioritario{background:var(--roxo)}
.chip.prioritario.ativo{background:var(--ouro);color:#2b1c00;border-color:var(--az3)}
/* GPS: verde-água, para achar de longe no meio dos botões */
.btn-mini.gps{background:#e6f6f1;color:#0d6b52;border-color:rgba(13,107,82,.35);font-weight:800}
.btn-gps{background:var(--verde);color:#fff;
  box-shadow:0 10px 22px -12px rgba(13,122,92,.9)}
/* botão principal de impressão do cupom */
.btn-cupom{background:var(--amarelo) !important;color:#fff !important;
  border-color:#c8690a !important;box-shadow:0 10px 22px -12px rgba(200,105,10,.95)}
.btn.recebido-ok{border-color:rgba(30,126,52,.45);background:#e7f6ec;color:#166b2c}
/* aviso forte do pop-up de pedidos pendentes */
.aviso-forte{font-weight:900;font-size:1.02rem;color:#8a3b06;background:#fff4e0;
  border:1px solid rgba(240,160,32,.6);border-left:4px solid #e5760a;
  border-radius:12px;padding:12px 14px;line-height:1.45}
.item-lista.resolvido{opacity:.5}
/* ═══ toque: resposta imediata em tudo que grava ═══ */
.btn,.btn-mini,.chip,.item-lista,.card-visita,.card-escolha,.btn-icon,.op-filtro,.etiqueta{
  transition:transform .12s cubic-bezier(.2,.8,.3,1),box-shadow .18s,filter .18s,background .18s}
.tocado{transform:scale(.97) !important;filter:brightness(.96)}
.btn.tocado,.btn-mini.tocado{box-shadow:0 2px 6px -4px rgba(36,27,82,.6) !important}
.card-visita.tocado,.item-lista.tocado{transform:scale(.988) !important}
body.destravando{opacity:.999}
/* número que acabou de mudar: pulso curto, sem redesenhar a tela */
@keyframes valor-muda{0%{transform:scale(1)}30%{transform:scale(1.16)}100%{transform:scale(1)}}
.valor-muda{animation:valor-muda .28s cubic-bezier(.2,.8,.3,1);will-change:transform}
/* campo de quantidade do stepper: brilho rápido ao somar/diminuir */
@keyframes qtde-muda{0%{box-shadow:0 0 0 0 rgba(219,128,255,.55)}
  100%{box-shadow:0 0 0 9px rgba(219,128,255,0)}}
.qtde-muda{animation:qtde-muda .34s ease-out}
/* produto recém-adicionado ou recém-editado entra deslizando */
@keyframes item-entra{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.card-item.entrando{animation:item-entra .26s cubic-bezier(.2,.8,.3,1)}
.card-item{transition:box-shadow .18s,border-color .18s}
@media (prefers-reduced-motion:reduce){
  .tocado{transform:none !important}
  .valor-muda,.qtde-muda,.card-item.entrando{animation:none !important}
}

/* ═══ ROTA: hierarquia clara, poucos botões ═══ */
.secao-rota{display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin:18px 2px 6px;padding-bottom:6px;border-bottom:2px solid var(--borda2)}
.secao-rota strong{display:flex;align-items:center;gap:7px;font-size:.78rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--sub)}
.secao-rota.feita strong{color:#166b2c}
.card-visita{margin-bottom:2px}
.cv-topo{display:flex;align-items:flex-start;gap:10px}
.cv-nome{display:block;font-size:1.06rem;line-height:1.25;color:var(--navy)}
.card-visita .ordem-num{width:28px;height:28px;min-width:28px;border-radius:9px;font-size:.82rem;margin-top:1px}
.farol-grande{width:14px;height:14px;border-radius:50%;flex:0 0 auto;margin-top:6px;
  box-shadow:0 0 0 3px rgba(255,255,255,.9),0 1px 4px rgba(0,0,0,.18)}
.farol-grande.vermelho{background:var(--erro)}.farol-grande.amarelo{background:var(--aviso)}
.farol-grande.verde{background:var(--ok)}.farol-grande.cinza{background:#98a4b8}
.cv-info{display:flex;flex-direction:column;gap:5px;font-size:.84rem;color:var(--sub);line-height:1.35}
.cv-info>div{display:flex;align-items:flex-start;gap:7px}
.cv-info .ic{flex:0 0 auto;margin-top:2px;opacity:.75}
.btn-visita{background:var(--verde);box-shadow:0 10px 22px -12px rgba(27,122,55,.9);
  letter-spacing:.04em}
.cv-acoes{display:flex;align-items:center;gap:8px}
.cv-acoes .btn-mini{padding:10px 12px}
.cv-acoes .btn-mini .ic{width:1.15em;height:1.15em}
.selos{flex-wrap:wrap}

/* ═══ FILTROS CENTRALIZADOS ═══ */
.barra-filtros{display:flex;flex-direction:column}
.btn-filtros{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;
  background:var(--roxo);color:#fff;font-weight:800;font-size:.86rem;
  box-shadow:0 6px 16px -8px rgba(36,27,82,.7)}
.btn-filtros.ativo{background:var(--ouro);color:#2b1c00;box-shadow:0 6px 16px -8px rgba(201,134,26,.8)}
.btn-filtros .ic{width:1.15em;height:1.15em}
.cont-filtros{background:rgba(255,255,255,.28);border-radius:999px;padding:1px 8px;font-size:.78rem}
.btn-filtros.ativo .cont-filtros{background:rgba(0,0,0,.18)}
.etiquetas{display:flex;flex-wrap:wrap;gap:6px}
.etiqueta{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--borda);
  border-radius:999px;padding:6px 11px;font-size:.78rem;font-weight:700;color:var(--navy)}
.etiqueta .ic{width:.9em;height:.9em;opacity:.6}
.grupo-filtro+.grupo-filtro{margin-top:14px}
.grupo-filtro-tit{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--sub);font-weight:800;margin-bottom:7px}
.opcoes-filtro{display:flex;flex-wrap:wrap;gap:6px}
.op-filtro{background:var(--vidro2);border:1.5px solid var(--borda);border-radius:11px;
  padding:9px 13px;font-size:.84rem;font-weight:700;color:var(--navy)}
.op-filtro.ativo{background:var(--roxo);color:#fff;border-color:var(--az3);
  box-shadow:0 5px 12px -7px rgba(17,80,168,.9)}

/* ═══ POTENCIAL DO CLIENTE ═══ */
.badge.pot{font-size:.63rem;letter-spacing:.07em}
.badge.pot .ic{width:.95em;height:.95em}
.pot-baixo{background:#f1f3f8;color:#5d6b84;border-color:rgba(93,107,132,.35)}
.pot-normal{background:#e7f0fd;color:#1150a8;border-color:rgba(17,80,168,.3)}
.pot-alto{background:#e7f6ec;color:#166b2c;border-color:rgba(30,126,52,.35)}
.pot-muito_alto{background:var(--amarelo);color:#2b1c00;border-color:#c9861a}
.pot-sem{background:#fff;color:var(--sub2);border-color:var(--borda)}

/* ═══ OBSERVAÇÃO DO PEDIDO (vermelho, impossível de não ver) ═══ */
.btn-obs{background:var(--vermelho) !important;color:#fff !important;
  box-shadow:0 10px 22px -12px rgba(179,33,43,.95)}
.obs-emoji{font-size:1.15em;line-height:1}
.btn-mini.obs{background:#fdeced;color:#b3212b;border-color:rgba(232,71,76,.5);font-weight:800}
.selos-pedido{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:6px}
.selo-obs{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:#fdeced;border:1.5px solid rgba(232,71,76,.55);font-size:.95rem;
  box-shadow:0 6px 14px -8px rgba(179,33,43,.7)}
.card-pedido.com-obs{border-left:3px solid var(--erro)}
.obs-box{background:#fdeced;border:1.5px solid rgba(232,71,76,.5);border-left:5px solid var(--erro);
  border-radius:14px;padding:14px}
.obs-tit{display:flex;align-items:center;gap:8px;font-weight:900;color:#b3212b;
  font-size:.95rem;letter-spacing:.03em}
.obs-texto{margin-top:8px;color:#5c1015;font-size:1rem;line-height:1.5;white-space:pre-wrap;font-weight:600}

/* ═══ POP-UP DE PEDIDO PENDENTE: centralizado, laranja, com entrada ═══ */
.ns-overlay.centro{display:flex;align-items:center;justify-content:center;padding:18px}
.ns-modal.centro{position:relative;margin:0;width:100%;max-width:440px;border-radius:24px;
  max-height:86vh;animation:pop-entra .32s cubic-bezier(.16,1,.3,1)}
.ns-modal.centro::before{display:none}
@keyframes pop-entra{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
.modal-pendente{border:2px solid #e5760a;box-shadow:0 30px 70px -24px rgba(200,105,10,.75)}
.modal-pendente .ns-modal-head{background:var(--amarelo);color:#fff;
  border-bottom:none;border-radius:22px 22px 0 0}
.modal-pendente .ns-modal-head strong{font-size:1.05rem;letter-spacing:.06em}
.modal-pendente .ns-modal-head .btn-icon{color:#fff}
.modal-pendente .aviso-forte{background:var(--amarelo-tint);
  border:1.5px solid #e5760a;border-left:5px solid #e5760a;color:#8a3b06;font-size:1.06rem}
.card-export{background:var(--vidro);border:1px solid var(--borda);border-left:4px solid var(--az2);
  border-radius:var(--r-md);padding:13px 15px;box-shadow:var(--sombra-1)}
.sub-aviso{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;color:#b3212b}
.pre{white-space:pre-wrap}
.btn-perigo{background:var(--vermelho) !important;color:#fff !important;
  border-color:#8a1c24 !important}
/* caixa de aviso (ex.: dados sem atualizar por limite do banco) */
.aviso-box{background:#fff4e0;border:1px solid rgba(240,160,32,.55);border-left:4px solid var(--aviso);
  border-radius:12px;padding:11px 13px;color:#6b4405}
.aviso-box strong{display:flex;align-items:center;gap:7px;color:#8a5606;font-size:.9rem}
.aviso-box .sub{color:#7a4f06}
/* aviso de versão nova — o app nunca se recarrega sozinho */
.barra-atualizar{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));
  z-index:70;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--navy);color:#fff;border-radius:14px;padding:10px 12px;font-size:.82rem;font-weight:700;
  box-shadow:0 16px 34px -14px rgba(36,27,82,.9)}
.barra-atualizar .btn-mini{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)}
.atendido-linha{display:flex;align-items:center;gap:7px;font-size:.8rem;font-weight:700;
  color:#166b2c;background:#e7f6ec;border:1px solid rgba(30,126,52,.3);
  border-radius:9px;padding:6px 10px}
/* histórico: quem foi atendido no dia mas não está mais na rota daquele dia */
.card-visita.historico{width:100%;text-align:left;border-left:4px solid var(--sub2);
  background:var(--bg2);opacity:.75}
.nota-previa{font-size:.78rem;color:var(--az3);font-weight:600;margin-top:4px;background:rgba(var(--glow-rgb),.09);border-left:3px solid var(--az2);border-radius:6px;padding:5px 8px}
/* cartão de item do pedido: título marinho, valor destacado em azul forte */
.card-item{background:#fff;border:1px solid var(--borda);border-left:4px solid var(--az2);
  border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--sombra-1)}
.card-item>.row>strong{color:var(--navy);font-size:.95rem;line-height:1.3}
.card-item .row.space.mt4 span{color:var(--texto);font-weight:600;font-size:.88rem}
.card-item .row.space.mt4 strong{color:var(--az3);font-size:1.1rem;font-weight:900;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.card-item .btn-link{padding:6px 0 0;font-weight:700}
.card-escolha{background:var(--vidro);border:1.5px solid var(--borda2);border-radius:var(--r-lg);padding:18px;
  text-align:left;display:flex;flex-direction:column;gap:3px;box-shadow:var(--sombra-1);transition:.25s}
.card-escolha:active{transform:scale(.985)}
.card-escolha.ativo{border-color:rgba(var(--glow-rgb),.7);
  background:var(--lilas-tint);
  box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 12px 28px -12px rgba(var(--glow-rgb),.5)}
.chip-cliente{background:var(--vidro2);border:1px solid var(--borda);border-radius:var(--r-md);
  padding:11px 15px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sombra-1)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.dias-scroll{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.dias-scroll::-webkit-scrollbar{display:none}
.dias-scroll .chip{flex:0 0 auto}

.sugestao{background:var(--lilas-tint);
  border:1px solid rgba(var(--glow-rgb),.35);border-radius:var(--r-md);padding:11px 13px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.85rem;box-shadow:var(--sombra-1)}
.aviso{color:var(--erro);font-size:.85rem}
.hist-linha{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--vidro);
  border:1px solid var(--borda);border-radius:var(--r-sm);padding:10px 13px;font-size:.85rem;box-shadow:var(--sombra-1)}
.hist-linha.apagado{opacity:.55}

/* ── progresso com brilho vivo ── */
.progresso-info{font-size:.85rem;font-weight:700;margin-bottom:5px;letter-spacing:.01em}
.progresso-barra{height:12px;border-radius:999px;background:var(--bg2);overflow:hidden;
  box-shadow:0 1px 3px rgba(36,27,82,.14) inset;border:1px solid var(--borda)}
.progresso-fill{height:100%;border-radius:999px;position:relative;
  background:var(--roxo);transition:width .5s cubic-bezier(.22,1,.36,1);
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 0 14px rgba(var(--glow-rgb),.45)}
.progresso-fill::after{content:'';position:absolute;inset:0;border-radius:999px;
  background:transparent;
  background-size:220% 100%;animation:shimmer 2.6s infinite linear}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-40% 0}}
.rota-info{background:var(--vidro2);border:1px solid var(--borda);border-radius:var(--r-sm);
  padding:10px 13px;font-size:.85rem;font-weight:700;box-shadow:var(--sombra-1)}

/* ── barra de total: painel marinho com valor em ouro claro (alto contraste) ── */
.total-bar{background:var(--roxo);color:#fff;border:none;
  border-radius:var(--r-md);padding:15px 17px;display:flex;justify-content:space-between;align-items:center;
  gap:10px;font-size:.95rem;font-weight:600;box-shadow:var(--sombra-2);position:relative;overflow:hidden}
.total-bar::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad-ouro)}
.total-bar span{color:#dfe6fb;font-size:.86rem;line-height:1.35;font-weight:700}
.total-bar strong{font-size:1.28rem;font-weight:900;color:var(--ouro-claro);
  font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.3)}
/* ── caixa de cálculo do item: fundo marinho, rótulo claro, número em branco/ouro ── */
.calc-live{background:var(--roxo);color:#fff;
  border:none;border-radius:var(--r-md);padding:14px 16px;display:flex;flex-direction:column;gap:9px;
  font-size:.92rem;box-shadow:var(--sombra-2);font-variant-numeric:tabular-nums}
.calc-live .row span{color:#c3cdec;font-weight:600}
.calc-live .row strong{color:#fff;font-weight:800;font-size:1rem}
.calc-live .destaque{border-top:1px solid rgba(255,255,255,.22);padding-top:9px;margin-top:1px}
.calc-live .destaque span{color:#fff;font-weight:800}
.calc-live .destaque strong{font-size:1.22rem;font-weight:900;color:var(--ouro-claro);
  text-shadow:0 1px 2px rgba(0,0,0,.3)}
.calc-live .aviso{color:#ffb3b6;font-weight:700;background:rgba(255,120,126,.14);
  border-left:3px solid #ff8a8f;border-radius:8px;padding:8px 10px;margin-top:2px}

/* ── painel de metas: primeira coisa que o vendedor vê ao abrir o app ── */
.painel-meta{background:var(--roxo);color:#fff;
  border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--sombra-2);position:relative;overflow:hidden}
.painel-meta::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad-ouro)}
.painel-meta-topo{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.painel-meta-topo span{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#b6c0e6}
.painel-meta-topo strong{font-size:1.5rem;font-weight:900;color:var(--ouro-claro);font-variant-numeric:tabular-nums}
.painel-meta .progresso-barra{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2);box-shadow:none}
.painel-comissao{background:var(--roxo);color:#fff;
  border-radius:var(--r-lg);padding:15px 17px;box-shadow:var(--sombra-2);position:relative;overflow:hidden}
.painel-comissao::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--az1)}
.painel-comissao .painel-meta-topo strong{color:#fff}
.painel-comissao .meta-linha>span{color:#c6dcf7}
.painel-comissao .meta-linha>strong.destaque{color:var(--ouro-claro)}
.meta-corpo{display:flex;flex-direction:column;gap:7px}
.meta-linha{font-size:.92rem}
.meta-linha>span{color:#c3cdec;font-weight:600}
.meta-linha>strong{font-weight:800;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.meta-linha>strong.destaque{color:var(--ouro-claro);font-size:1.06rem}
.meta-linha>strong.ok{color:#8ef0bb}
.meta-sep{height:1px;background:rgba(255,255,255,.2);margin:3px 0}
.meta-selo{text-align:center;font-weight:800;font-size:.85rem;padding:8px;border-radius:10px;
  background:rgba(46,194,126,.2);color:#8ef0bb;border:1px solid rgba(46,194,126,.45)}

/* ── KPIs: azulejos de vidro com profundidade ── */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--vidro);backdrop-filter:blur(10px);border:1px solid var(--borda);
  border-radius:var(--r-md);padding:13px 14px;display:flex;flex-direction:column;gap:4px;
  box-shadow:var(--sombra-1);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;
  background:transparent}
.kpi-rot{font-size:.64rem;color:var(--sub2);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.kpi-val{font-size:1.12rem;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi.destaque{border-color:rgba(var(--glow-rgb),.5);
  background:var(--lilas-tint)}
.kpi.destaque .kpi-val{color:var(--az3);font-size:1.2rem}
.kpi.ok .kpi-val{color:var(--ok)}.kpi.erro .kpi-val{color:var(--erro)}.kpi.aviso .kpi-val{color:var(--aviso)}

/* ── tabelas ── */
.tabela-scroll{overflow-x:auto;border:1px solid var(--borda);border-radius:var(--r-md);
  background:var(--vidro);box-shadow:var(--sombra-1)}
.tabela{border-collapse:collapse;width:100%;font-size:.72rem;min-width:560px;font-variant-numeric:tabular-nums}
.tabela th,.tabela td{padding:7px 8px;border-bottom:1px solid var(--borda);text-align:left;color:var(--texto)}
.tabela tbody tr:nth-child(even) td{background:#f7f9fd}
.tabela td.r strong{color:var(--az3);font-weight:900}
.tabela th{background:var(--navy);font-size:.66rem;white-space:nowrap;color:#fff;
  text-transform:uppercase;letter-spacing:.05em}
.tabela tr:last-child td{border-bottom:none}

/* ── fechamento do pedido: cada bloco com cor e rótulo próprios ── */
.campo-box{border:1.5px solid var(--borda2);border-left-width:5px;border-radius:var(--r-md);
  padding:13px 15px;background:#fff;box-shadow:var(--sombra-1)}
.campo-box.azul{border-left-color:var(--az2);background:var(--roxo-tint)}
.campo-box.ouro{border-left-color:var(--ouro);background:var(--amarelo-tint)}
.campo-box.roxo{border-left-color:var(--prospec);background:var(--lilas-tint)}
.campo-box.cinza{border-left-color:var(--sub2);background:var(--bg2)}
.campo-box.verde{border-left-color:var(--ok);background:var(--verde-tint)}
.desc-resumo{margin-top:9px;display:flex;flex-direction:column;gap:5px;font-size:.88rem}
.desc-resumo strong{font-variant-numeric:tabular-nums;color:var(--navy)}
.desc-resumo strong.menos{color:var(--erro)}
.desc-resumo .total{border-top:1.5px solid var(--borda2);padding-top:6px;margin-top:2px}
.desc-resumo .total strong{font-size:1.12rem;font-weight:900;color:var(--ok)}
.campo-box-tit{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:.76rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--navy);margin-bottom:9px}
.campo-box-tit .obrig{background:var(--erro);color:#fff;font-size:.6rem;letter-spacing:.06em;
  padding:2px 7px;border-radius:999px}
.campo-box-tit .so-interno{background:var(--bg2);color:var(--sub);font-size:.6rem;letter-spacing:.06em;
  padding:2px 7px;border-radius:999px;border:1px solid var(--borda)}
.campo-box-ajuda{font-size:.76rem;color:var(--sub);margin-top:7px;line-height:1.45}
.campo-box .input{background:#fff}
.chk-grande{font-weight:700;font-size:.92rem;color:var(--navy)}

/* ── botão de coletar assinatura: último passo, maior e com cor própria ── */
.btn-assinar{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;
  padding:20px 18px;border-radius:18px;font-weight:900;font-size:1.06rem;letter-spacing:.06em;
  background:var(--lilas);color:#fff;
  box-shadow:0 1px 0 rgba(255,255,255,.28) inset,0 14px 30px -12px rgba(92,31,150,.75);
  border:none;transition:transform .15s,filter .2s}
.btn-assinar .ic{width:1.5em;height:1.5em;stroke-width:1.8}
.btn-assinar:active{transform:translateY(2px) scale(.985);filter:brightness(.94)}
.btn-assinar.coletada{background:var(--verde);
  box-shadow:0 1px 0 rgba(255,255,255,.28) inset,0 12px 26px -12px rgba(18,105,46,.7)}

/* ── assinatura: papel claro para tinta escura (vai pro PDF) ── */
.assinatura-area{border:2px dashed rgba(var(--glow-rgb),.45);border-radius:var(--r-lg);
  background:#fdfdfb;margin-top:10px;touch-action:none;
  box-shadow:0 1px 4px rgba(36,27,82,.10) inset}
.assinatura-cv{display:block;width:100%;height:220px;touch-action:none}
.assinatura-preview img{max-width:100%;max-height:110px;display:block;margin:0 auto;
  border:1px solid var(--borda);border-radius:10px;background:#fff}
.sucesso-banner{background:#e7f6ec;color:#166b2c;border:1px solid rgba(30,126,52,.4);
  border-radius:var(--r-md);padding:13px 15px;font-weight:800;margin-bottom:8px;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 10px 24px -12px rgba(79,201,141,.35)}

/* ── modal: folha de vidro com alça ── */
.ns-overlay{position:fixed;inset:0;background:rgba(4,7,16,.62);backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);z-index:40;display:flex;align-items:flex-end;justify-content:center;
  animation:surge .2s ease-out}
@keyframes surge{from{opacity:0}to{opacity:1}}
.ns-modal{background:#ffffff;
  backdrop-filter:blur(24px);width:100%;max-width:640px;max-height:92vh;
  border-radius:26px 26px 0 0;border:1px solid var(--borda2);border-bottom:none;
  display:flex;flex-direction:column;animation:sobe .32s cubic-bezier(.22,1,.36,1);
  box-shadow:0 -20px 60px -20px rgba(15,23,55,.45);position:relative}
.ns-modal::before{content:'';position:absolute;top:9px;left:50%;transform:translateX(-50%);
  width:44px;height:4px;border-radius:99px;background:rgba(36,27,82,.22)}
.ns-modal.full{height:96vh}
@keyframes sobe{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
.ns-modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 18px 8px}
.ns-modal-body{padding:10px 18px 30px;overflow-y:auto}
#ns-toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:104px;
  background:#16233b;backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);
  color:#fff;padding:12px 19px;border-radius:14px;font-size:.88rem;font-weight:600;opacity:0;
  pointer-events:none;transition:.3s cubic-bezier(.22,1,.36,1);z-index:60;max-width:92vw;text-align:center;
  box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 20px 44px -12px rgba(0,0,0,.8)}
#ns-toast.show{opacity:1;transform:translateX(-50%)}
#ns-toast.erro{background:rgba(120,40,44,.94);border-color:rgba(239,112,118,.5)}

/* ── suporte (aba Ajuda) ── */
#tabs button.tab-ajuda{opacity:.75}
#tabs button.tab-ajuda.ativo{opacity:1}
.chat-lista{display:flex;flex-direction:column;gap:8px;margin-top:12px;min-height:40vh;max-height:56vh;
  overflow-y:auto;padding:4px 2px}
.chat-msg{max-width:88%;padding:12px 15px;border-radius:16px;font-size:.95rem;line-height:1.5;white-space:pre-wrap}
.chat-msg.eu{align-self:flex-end;background:var(--grad-ouro);color:#241b04;font-weight:600;
  border-bottom-right-radius:5px;box-shadow:var(--sombra-ouro)}
.chat-msg.bot{align-self:flex-start;background:var(--vidro);border:1px solid var(--borda);
  border-bottom-left-radius:5px;box-shadow:var(--sombra-1)}
.chat-msg.pensando{color:var(--sub);font-style:italic;animation:pulsa 1.2s ease-in-out infinite}
@keyframes pulsa{0%,100%{opacity:.5}50%{opacity:1}}

/* ── login: vitrine ── */
.login-box{max-width:370px;margin:10vh auto 0;display:flex;flex-direction:column;gap:11px;
  text-align:center;padding:26px 22px 30px;background:var(--vidro);backdrop-filter:blur(16px);
  border:1px solid var(--borda2);border-radius:26px;box-shadow:var(--sombra-2);position:relative;overflow:hidden}
.login-box::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;
  background:var(--lilas-tint)}
.login-logo{filter:drop-shadow(0 8px 18px rgba(var(--glow-rgb),.45));animation:flutua 5s ease-in-out infinite;
  display:flex;justify-content:center}
.login-logo{width:110px;height:110px;object-fit:contain;display:block}
.logo-mark{display:inline-flex;align-items:center;gap:8px}
.logo-mark img{width:30px;height:30px;object-fit:contain;display:block}
.logo-mark strong{letter-spacing:.09em;font-size:1rem;text-transform:uppercase;color:#fff}
.tema-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tema-opt{border:1.5px solid var(--borda2);border-radius:var(--r-md);padding:14px;display:flex;align-items:center;gap:10px;
  background:var(--vidro);box-shadow:var(--sombra-1);font-weight:700;transition:.2s}
.tema-opt.ativo{border-color:rgba(var(--glow-rgb),.8);box-shadow:0 0 0 3px rgba(var(--glow-rgb),.2)}
.tema-bola{width:26px;height:26px;border-radius:50%;flex:0 0 auto;box-shadow:0 2px 6px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.4) inset}
@keyframes flutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.login-box h1{color:var(--navy);letter-spacing:.14em;text-transform:uppercase;font-size:1.7rem}
/* o nome do app na tela de entrada sai igual à logo: "Prompt Star.", sem caixa alta */
.login-box h1.login-marca{text-transform:none;letter-spacing:.01em;font-weight:700;font-size:2rem}
.login-tag{letter-spacing:.34em;text-transform:uppercase;font-size:.68rem;color:var(--sub);
  margin-top:-6px;padding-left:.34em}
.login-box .input{text-align:center}

/* ═══ PROMPT STAR — acabamento da identidade (cores sólidas) ═══
   Amarelo e verde-limão são cores CLARAS: texto sobre elas é sempre o roxo
   institucional, nunca branco, senão some. */
.btn{background:var(--roxo);color:#fff;box-shadow:var(--sombra-1)}
.btn:disabled{background:var(--bg2);color:var(--sub2);box-shadow:none}
.btn-sec{background:var(--branco);color:var(--roxo);border:1.5px solid var(--borda2);box-shadow:none}
.btn.laranja,.btn-mini.laranja{background:var(--amarelo);color:var(--roxo);border-color:var(--amarelo-escuro)}
.btn-visita{background:var(--verde);color:var(--roxo);box-shadow:var(--sombra-1)}
.btn-visita .ic{stroke-width:2.2}
.btn-mini.verde{background:var(--verde);color:var(--roxo);border-color:var(--verde-escuro)}
.btn-mini.vermelho{background:var(--vermelho-tint);color:var(--vermelho-escuro);border-color:var(--vermelho)}
.btn-perigo,.btn.btn-perigo{background:var(--vermelho) !important;color:#fff !important;border-color:var(--vermelho-escuro) !important}
.btn-obs{background:var(--vermelho) !important;color:#fff !important}
.btn-cupom{background:var(--amarelo) !important;color:var(--roxo) !important;border-color:var(--amarelo-escuro) !important}
.btn-gps{background:var(--verde);color:var(--roxo)}
.btn-mini.gps{background:var(--verde-tint);color:var(--verde-escuro);border-color:var(--verde)}
.btn-assinar{background:var(--lilas);color:var(--roxo)}
.btn-assinar.coletada{background:var(--verde);color:var(--roxo)}
.btn.recebido-ok{background:var(--verde-tint);color:var(--verde-escuro);border-color:var(--verde)}
.chip{background:var(--roxo);color:#fff}
.chip.ativo{background:var(--amarelo);color:var(--roxo);border-color:var(--amarelo-escuro)}
.chip.prospec{background:var(--lilas);color:var(--roxo)}
.chip.prioritario{background:var(--roxo-claro);color:#fff}
.chip.prospec.ativo,.chip.prioritario.ativo{background:var(--amarelo);color:var(--roxo)}
.btn-filtros{background:var(--roxo);color:#fff}
.btn-filtros.ativo{background:var(--amarelo);color:var(--roxo)}
.op-filtro.ativo{background:var(--roxo);color:#fff;border-color:var(--roxo)}
.badge.ok{background:var(--verde-tint);color:var(--verde-escuro);border-color:var(--verde)}
.badge.erro{background:var(--vermelho-tint);color:var(--vermelho-escuro);border-color:var(--vermelho)}
.badge.aviso{background:var(--amarelo-tint);color:var(--amarelo-escuro);border-color:var(--amarelo)}
.badge.prospec{background:var(--lilas);color:var(--roxo);border-color:var(--lilas-escuro)}
.badge.prioritario{background:var(--roxo);color:#fff;border-color:var(--roxo-escuro)}
.badge.pot.pot-muito_alto{background:var(--amarelo);color:var(--roxo);border-color:var(--amarelo-escuro)}
.badge.pot.pot-alto{background:var(--verde-tint);color:var(--verde-escuro);border-color:var(--verde)}
.badge.pot.pot-normal{background:var(--lilas-tint);color:var(--lilas-escuro);border-color:var(--lilas)}
.st-tag.verde,.farol-grande.verde{background:var(--verde-escuro)}
.st-tag.amarelo,.farol-grande.amarelo{background:var(--amarelo)}
.st-tag.vermelho,.farol-grande.vermelho{background:var(--vermelho)}
.atendido-linha{background:var(--verde-tint);color:var(--verde-escuro);border-color:var(--verde)}
.aviso-forte{background:var(--amarelo-tint);border-color:var(--amarelo-escuro);
  border-left-color:var(--amarelo-escuro);color:#6b4405}
.modal-pendente{border-color:var(--amarelo-escuro);box-shadow:0 30px 70px -24px rgba(41,15,93,.6)}
.modal-pendente .ns-modal-head{background:var(--amarelo);color:var(--roxo)}
.modal-pendente .ns-modal-head .btn-icon{color:var(--roxo)}
.modal-pendente .aviso-forte{background:var(--branco);border-color:var(--amarelo-escuro)}
.obs-box{background:var(--vermelho-tint);border-color:var(--vermelho);border-left-color:var(--vermelho)}
.obs-tit{color:var(--vermelho-escuro)}
.obs-texto{color:#6b1414}
.selo-obs{background:var(--vermelho-tint);border-color:var(--vermelho)}
.selo-nf{background:var(--amarelo);color:var(--roxo);box-shadow:var(--sombra-1)}
.card-pedido.com-obs{border-left-color:var(--vermelho)}
.item-lista.prioritario{background:var(--roxo-tint)}
.card-visita.prioritario{background:var(--roxo-tint)}
.card-visita.prospec{background:var(--lilas-tint)}
.item-lista.prospec{background:var(--lilas-tint)}
.aviso-box{background:var(--amarelo-tint);border-color:var(--amarelo-escuro);border-left-color:var(--amarelo-escuro)}
.total-bar{background:var(--roxo);color:#fff}
.total-bar strong{color:var(--amarelo)}
#fab{background:var(--amarelo);color:var(--roxo);box-shadow:0 10px 26px -10px rgba(41,15,93,.6)}
#tabs button.ativo{color:var(--amarelo);background:rgba(255,255,255,.12)}
.sync-chip.ok{background:rgba(193,255,114,.22);color:var(--verde);border-color:rgba(193,255,114,.55)}
.sync-chip.off{background:rgba(249,209,50,.22);color:var(--amarelo);border-color:rgba(249,209,50,.55)}
.sync-chip.erro{background:rgba(255,87,87,.22);color:#ffc9c9;border-color:rgba(255,87,87,.6)}
.sucesso-banner{background:var(--verde-tint);color:var(--verde-escuro);border-color:var(--verde)}
.progresso-fill{background:var(--amarelo)}
.tema-opt.ativo{border-color:var(--roxo)}
</style>
</head>
<body>
<header id="topbar" style="display:none"></header>
<main id="view"></main>
<button id="fab" title="Novo pedido" aria-label="Novo pedido"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.2v13.6M5.2 12h13.6"/></svg></button>
<nav id="tabs" style="display:none">
  <button data-v="hoje"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M8 3v4M16 3v4M3 10h18"/><circle cx="8.4" cy="14.4" r="1.15" fill="currentColor" stroke="none"/></svg>Hoje</button>
  <button data-v="clientes"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 10.8V20a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1v-9.2"/><path d="M2.6 9.6 4.3 4.2a1.2 1.2 0 0 1 1.15-.85h13.1a1.2 1.2 0 0 1 1.15.85l1.7 5.4a2.7 2.7 0 0 1-4.6 2.2 2.7 2.7 0 0 1-4.6 0 2.7 2.7 0 0 1-4.6 0 2.7 2.7 0 0 1-4.6-2.2Z"/><path d="M9.8 21v-5.2h4.4V21"/></svg>Clientes</button>
  <button data-v="pedidos"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 3.4a1 1 0 0 1 1-1h11a1 1 0 0 1 1 1v17.9l-2.6-1.6-2.45 1.6L11 19.7l-2.45 1.6L6 19.7l-.5.3Z"/><path d="M9 7.6h6M9 11.2h6M9 14.8h3.5"/></svg>Pedidos</button>
  <button data-v="dash"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.2 21h17.6"/><path d="M7 21v-8.2M12 21V4.6M17 21v-5.6"/></svg>Painel</button>
  <button data-v="mais"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.2h16M4 12h16M4 16.8h16"/></svg>Mais</button>
  <button data-v="ajuda" class="tab-ajuda"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.4a2.8 2.8 0 1 1 3.5 4.2v1.2"/><circle cx="12" cy="17.6" r="1" fill="currentColor" stroke="none"/></svg>Ajuda</button>
</nav>
<script src="js/calc.js"></script>
<script src="js/seed.js"></script>
<script src="js/ui.js"></script>
<script src="js/db.js"></script>
<script src="js/rota.js"></script>
<script src="js/pdf.js"></script>
<script src="js/pedido.js"></script>
<script src="js/ajuda.js"></script>
<script src="js/app.js"></script>
</body>
</html>
