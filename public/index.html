<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#16233b">
<title>New Star — Representante</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script>
/* ===== CONFIG — preencher antes do deploy (Firebase) ===== */
window.NS_CONFIG = {
  FIREBASE_PROJECT_ID: '', // ID do projeto no console do Firebase
  FIREBASE_API_KEY: ''     // chave Web API (Configurações do projeto → Geral)
};
</script>
<style>
:root{
  --azul:#16233b; --azul2:#22365c; --dourado:#c9a227; --fundo:#f4f5f8;
  --card:#fff; --texto:#1c2536; --sub:#68738a; --borda:#e3e6ee;
  --ok:#2f7a46; --erro:#9c3333; --aviso:#b98a2f;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--fundo);
  color:var(--texto);display:flex;flex-direction:column;overscroll-behavior:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit}

#topbar{background:var(--azul);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;position:sticky;top:0;z-index:20}
#topbar .sub{color:#b9c2d8}
.sel-rep{background:var(--azul2);color:#fff;border:1px solid #3a4f7d;border-radius:8px;padding:4px 8px;max-width:180px}
.sync-chip{font-size:.72rem;padding:4px 10px;border-radius:999px;background:#2c3d63;color:#cfd8ec;white-space:nowrap}
.sync-chip.ok{background:#1e4d31;color:#bfe8cd}
.sync-chip.off{background:#5c4a1e;color:#f0dfae}
.sync-chip.erro{background:#5c2626;color:#f2c5c5}

#view{flex:1;overflow-y:auto;padding:14px;padding-bottom:90px;max-width:640px;width:100%;margin:0 auto}
#tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--borda);
  padding-bottom:env(safe-area-inset-bottom);z-index:20}
#tabs button{flex:1;padding:10px 2px 8px;font-size:.68rem;color:var(--sub);display:flex;flex-direction:column;gap:2px;align-items:center}
#tabs button .ico{font-size:1.25rem}
#tabs button.ativo{color:var(--azul);font-weight:700}
#fab{position:fixed;right:16px;bottom:74px;width:58px;height:58px;border-radius:50%;background:var(--dourado);
  color:#fff;font-size:1.7rem;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:19;display:flex;align-items:center;justify-content:center}

h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1.02rem}h4{font-size:.92rem;color:var(--azul)}
.sub{font-size:.8rem;color:var(--sub)}
.row{display:flex;align-items:center}.col{display:flex;flex-direction:column}
.space{justify-content:space-between}.gap4{gap:4px}.gap8{gap:8px}.grow{flex:1}
.w100{width:100%}.c{text-align:center}.r{text-align:right}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb12{margin-bottom:12px}

.input{width:100%;padding:10px 12px;border:1px solid var(--borda);border-radius:10px;background:#fff}
.input.big{padding:14px;font-size:1.05rem}
.input.num{width:70px;text-align:center;padding:10px 4px}
.campo{display:flex;flex-direction:column;gap:3px}
.btn{background:var(--azul);color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;
  box-shadow:0 2px 6px rgba(22,35,59,.25)}
.btn:disabled{opacity:.4}
.btn.big{padding:16px;font-size:1.06rem}
.btn-sec{background:#fff;color:var(--azul);border:1.5px solid var(--azul)}
.btn-link{color:var(--azul);text-decoration:underline;font-size:.85rem;padding:4px}
.btn-icon{font-size:1.05rem;padding:6px}
.btn-mini{background:#eef1f7;border-radius:9px;padding:9px 12px;font-size:.82rem;font-weight:600}
.btn-mini.vermelho{background:#f7e7e7;color:var(--erro)}
.btn-step{width:46px;height:46px;border-radius:10px;background:#eef1f7;font-size:1.3rem;font-weight:700}
.btn-tam{flex:1;padding:14px;border:1.5px solid var(--borda);border-radius:12px;background:#fff;font-weight:700}
.btn-tam.ativo{border-color:var(--azul);background:var(--azul);color:#fff}

.lista{margin-top:10px;display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow-y:auto}
.item-lista{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:12px 14px;
  text-align:left;display:flex;flex-direction:column;gap:2px;width:100%}
.item-lista.compacto{flex-direction:row;justify-content:space-between;align-items:center;padding:9px 12px}
.item-lista.desabilitado{opacity:.55}
.vazio{color:var(--sub);text-align:center;padding:26px 8px}
.badge{font-size:.7rem;background:#e8ecf5;color:var(--azul);border-radius:999px;padding:3px 9px;white-space:nowrap}
.badge.ok{background:#e2f2e7;color:var(--ok)}
.badge.erro{background:#f7e2e2;color:var(--erro)}
.badge.aviso{background:#f7efd9;color:var(--aviso)}

.card-visita{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:12px 14px}
.card-visita.feito{opacity:.6}
.card-item{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:10px 12px}
.card-escolha{background:#fff;border:1.5px solid var(--borda);border-radius:14px;padding:16px;text-align:left;
  display:flex;flex-direction:column;gap:3px}
.card-escolha.ativo{border-color:var(--dourado);background:#fdf8ea}
.chip-cliente{background:#eef1f7;border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--borda);border-radius:999px;padding:7px 12px;font-size:.78rem;background:#fff}
.chip.ativo{background:var(--azul);border-color:var(--azul);color:#fff}
.sugestao{background:#fdf8ea;border:1px solid #ecd9a0;border-radius:10px;padding:10px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.85rem}
.aviso{color:var(--erro);font-size:.85rem}
.hist-linha{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;
  border:1px solid var(--borda);border-radius:10px;padding:9px 12px;font-size:.85rem}
.hist-linha.apagado{opacity:.6}

.progresso-info{font-size:.85rem;font-weight:600;margin-bottom:4px}
.progresso-barra{height:10px;border-radius:999px;background:#e3e6ee;overflow:hidden}
.progresso-fill{height:100%;background:linear-gradient(90deg,var(--azul),var(--dourado));transition:width .4s}
.rota-info{background:#eef1f7;border-radius:10px;padding:9px 12px;font-size:.85rem;font-weight:600}
.total-bar{background:var(--azul);color:#fff;border-radius:12px;padding:13px 16px;display:flex;
  justify-content:space-between;align-items:center;font-size:1rem}
.calc-live{background:#f2f4f9;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;font-size:.9rem}
.calc-live .destaque{font-size:1rem;color:var(--azul)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:3px}
.kpi-rot{font-size:.68rem;color:var(--sub);text-transform:uppercase;letter-spacing:.03em}
.kpi-val{font-size:1.05rem}
.kpi.destaque{border-color:var(--dourado);background:#fdf8ea}
.kpi.ok .kpi-val{color:var(--ok)}.kpi.erro .kpi-val{color:var(--erro)}.kpi.aviso .kpi-val{color:var(--aviso)}

.tabela-scroll{overflow-x:auto;border:1px solid var(--borda);border-radius:10px;background:#fff}
.tabela{border-collapse:collapse;width:100%;font-size:.72rem;min-width:560px}
.tabela th,.tabela td{padding:6px 7px;border-bottom:1px solid var(--borda);text-align:left}
.tabela th{background:#eef1f7;font-size:.68rem;white-space:nowrap}

.assinatura-area{border:2px dashed var(--borda);border-radius:14px;background:#fff;margin-top:10px;touch-action:none}
.assinatura-cv{display:block;width:100%;height:220px;touch-action:none}
.assinatura-preview img{max-width:100%;max-height:110px;display:block;margin:0 auto;border:1px solid var(--borda);border-radius:8px;background:#fff}
.sucesso-banner{background:#e2f2e7;color:var(--ok);border-radius:12px;padding:12px 14px;font-weight:700;margin-bottom:8px}

.ns-overlay{position:fixed;inset:0;background:rgba(12,18,32,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.ns-modal{background:var(--fundo);width:100%;max-width:640px;max-height:92vh;border-radius:18px 18px 0 0;
  display:flex;flex-direction:column;animation:sobe .22s ease-out}
.ns-modal.full{height:96vh}
@keyframes sobe{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.ns-modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}
.ns-modal-body{padding:10px 16px 26px;overflow-y:auto}
#ns-toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:96px;background:var(--azul);
  color:#fff;padding:11px 18px;border-radius:12px;font-size:.88rem;opacity:0;pointer-events:none;
  transition:.25s;z-index:60;max-width:92vw;text-align:center}
#ns-toast.show{opacity:1;transform:translateX(-50%)}
#ns-toast.erro{background:var(--erro)}

.login-box{max-width:360px;margin:12vh auto 0;display:flex;flex-direction:column;gap:10px;text-align:center;padding:0 8px}
.login-logo{font-size:3rem}
.login-box .input{text-align:center}
</style>
</head>
<body>
<header id="topbar" style="display:none"></header>
<main id="view"></main>
<button id="fab" title="Novo pedido" aria-label="Novo pedido">🧾</button>
<nav id="tabs" style="display:none">
  <button data-v="hoje"><span class="ico">📅</span>Hoje</button>
  <button data-v="clientes"><span class="ico">🏪</span>Clientes</button>
  <button data-v="pedidos"><span class="ico">🧾</span>Pedidos</button>
  <button data-v="dash"><span class="ico">📊</span>Painel</button>
  <button data-v="mais"><span class="ico">☰</span>Mais</button>
</nav>
<script src="js/calc.js"></script>
<script src="js/seed.js"></script>
<script src="js/ui.js"></script>
<script src="js/db.js"></script>
<script src="js/rota.js"></script>
<script src="js/pdf.js"></script>
<script src="js/pedido.js"></script>
<script src="js/app.js"></script>
</body>
</html>
